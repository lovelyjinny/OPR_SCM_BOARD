th{background:#eef1f6;font-size:12.5px;color:var(--ink2);font-weight:700;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}

function n(x){return (Math.round(x)||0).toLocaleString();}
function M(x){return (x/1e6).toFixed(1);}
function val(id){var v=parseFloat(document.getElementById(id).value); return isNaN(v)?0:v/100;}
var PER='f'; var PLAB={y:'연간(FW+SS)',f:'FW',s:'SS'};
function pk(r){                       /* 기간에 맞는 값 고르기 */
  if(PER==='f') return {cap:r.cap||0,shr:(r.shr!=null?r.shr:null),ly:r.ly||0,inq:r.inq||0,ina:r.ina||0,idem:r.idem||0};
  if(PER==='s') return {cap:r.cs||0,shr:(r.hs!=null?r.hs:null),ly:r.lys||0,inq:r.inqs||0,ina:r.inas||0,idem:r.ids||0};
  return {cap:(r.cap||0)+(r.cs||0),shr:null,ly:(r.ly||0)+(r.lys||0),
          inq:(r.inq||0)+(r.inqs||0),ina:(r.ina||0)+(r.inas||0),idem:(r.idem||0)+(r.ids||0)};
}
var BGR='전체';
function setBgr(g){BGR=g; bcdPanel();}
function applyShr(v){var e=document.getElementById('shr'); e.value=v; e.dispatchEvent(new Event('input'));}
function bcdPanel(){
  var el=document.getElementById('bcdp'); if(!el) return;
  if(!BCD.length){el.innerHTML='';return;}
  var key=(PER==='s')?'ss':'fw';
  var list=BCD.filter(function(r){return BGR==='전체'||r.gr===BGR;})
              .filter(function(r){return (r[key]||0)>0;})
              .sort(function(a,b){return (b[key]||0)-(a[key]||0);});
  var avg=list.length? list.reduce(function(a,r){return a+(r[key]||0);},0)/list.length : 0;
  var btns=['전체','S','A','B','C'].map(function(g){
    return '<button class="plcbtn" style="'+(BGR===g?'background:var(--gd);color:#fff;border-color:var(--gd)':'')

  if(!isNew && bsel.value==='__NEW__' && off0 && off0.brand && BD[off0.brand]) bsel.value=off0.brand;

function u16(d,o){return d[o]|(d[o+1]<<8);}
function u32(d,o){return (d[o]|(d[o+1]<<8)|(d[o+2]<<16)|(d[o+3]<<24))>>>0;}
async function unzip(buf){
  var d=new Uint8Array(buf), eo=-1;
  for(var i=d.length-22;i>=0 && i>d.length-66000;i--){ if(u32(d,i)===0x06054b50){eo=i;break;} }
  if(eo<0) throw new Error('엑셀(zip) 형식이 아닙니다');
  var n=u16(d,eo+10), off=u32(d,eo+16), files={}, p=off;
  for(var k=0;k<n;k++){
    if(u32(d,p)!==0x02014b50) break;
    var meth=u16(d,p+10), csz=u32(d,p+20), nl=u16(d,p+28), el=u16(d,p+30), cl=u16(d,p+32), lo=u32(d,p+42);
    files[new TextDecoder().decode(d.subarray(p+46,p+46+nl))]={meth:meth,csz:csz,lo:lo};
    p+=46+nl+el+cl;
  }
  async function read(name){
    var f=files[name]; if(!f) return null;
    var q=f.lo; if(u32(d,q)!==0x04034b50) return null;
    var nl=u16(d,q+26), el=u16(d,q+28), st=q+30+nl+el, raw=d.subarray(st,st+f.csz);
    if(f.meth===0) return new TextDecoder().decode(raw);
    var ds=new DecompressionStream('deflate-raw');
    var ab=await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(ab);
  }
  return {names:Object.keys(files),read:read};
}
function colIdx(ref){var m=/^([A-Z]+)/.exec(ref); if(!m) return 0; var c=0;
  for(var i=0;i<m[1].length;i++) c=c*26+(m[1].charCodeAt(i)-64); return c-1;}
async function readXlsx(file){
  var z=await unzip(await file.arrayBuffer());
  var wbx=await z.read('xl/workbook.xml'); if(!wbx) throw new Error('workbook 을 찾지 못했습니다');
  var doc=new DOMParser().parseFromString(wbx,'application/xml');
  var names=[].slice.call(doc.getElementsByTagName('sheet')).map(function(s){return s.getAttribute('name');});
  var idx=-1;
  for(var i=0;i<names.length;i++) if((names[i]||'').toUpperCase().indexOf('REPORT')>=0){idx=i;break;}
  if(idx<0) idx=names.length-1;
  var ss=[], sx=await z.read('xl/sharedStrings.xml');
  if(sx){var sd=new DOMParser().parseFromString(sx,'application/xml');
    ss=[].slice.call(sd.getElementsByTagName('si')).map(function(si){
      return [].slice.call(si.getElementsByTagName('t')).map(function(t){return t.textContent;}).join('');});}
  var IND=[], stx=await z.read('xl/styles.xml');
  if(stx){var std=new DOMParser().parseFromString(stx,'application/xml');
    var cx=std.getElementsByTagName('cellXfs')[0];
    if(cx) IND=[].slice.call(cx.getElementsByTagName('xf')).map(function(x){
      var al=x.getElementsByTagName('alignment')[0];
      return al?(parseInt(al.getAttribute('indent')||'0',10)||0):0;});}
  var sh=await z.read('xl/worksheets/sheet'+(idx+1)+'.xml');
  if(!sh) for(var i=1;i<=12;i++){ sh=await z.read('xl/worksheets/sheet'+i+'.xml'); if(sh) break; }
  if(!sh) throw new Error('시트를 찾지 못했습니다');
  var xd=new DOMParser().parseFromString(sh,'application/xml'), out=[];
  [].slice.call(xd.getElementsByTagName('row')).forEach(function(r){
    var row=[];
    [].slice.call(r.getElementsByTagName('c')).forEach(function(c){
      var t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], val=null;
      if(t==='s'&&v) val=ss[parseInt(v.textContent,10)];
      else if(t==='inlineStr'){var is=c.getElementsByTagName('t')[0]; val=is?is.textContent:null;}
      else if(v) val=parseFloat(v.textContent);
      var ci=colIdx(c.getAttribute('r')||'A1');
      row[ci]=val;
      var sIdx=parseInt(c.getAttribute('s')||'0',10);
      (row.__ind||(row.__ind=[]))[ci]=IND[sIdx]||0;
    });
    out.push(row);
  });
  return out;
}
function buildOffer(rows,fname){
  var hi=-1,cn=0,cq=-1,cr=-1,cc=-1;
  for(var i=0;i<Math.min(rows.length,12);i++){
    var r=rows[i]||[];
    for(var j=0;j<r.length;j++){ if(String(r[j]||'').toUpperCase().indexOf('QTY')>=0){hi=i;break;} }
    if(hi>=0) break;
  }
  if(hi<0) throw new Error('QTY 열을 찾지 못했습니다 (REPORT 시트 형식을 확인해 주세요)');
  var H=(rows[hi]||[]).map(function(x){return String(x||'').toUpperCase();});
  H.forEach(function(h,j){
    if(cq<0 && h.indexOf('QTY')>=0 && h.indexOf('%')<0) cq=j;
    if(cr<0 && h.indexOf('TOTAL RRP')>=0) cr=j;
    if(cc<0 && (h.indexOf('TOTAL JSC PRIC')>=0||h.indexOf('TOTAL PRICE')>=0)) cc=j;
    if(h.indexOf('GENDER')>=0) cn=j;
  });
  /* 계층은 이름이 아니라 구조로 판단 — 뒤따르는 줄들의 합 = 자기 수량이면 묶음 */
  var DAT=[];
  for(var i=hi+1;i<rows.length;i++){
    var r=rows[i]||[], nm=String(r[cn]==null?'':r[cn]).trim(); if(!nm) continue;
    DAT.push([nm,+(r[cq]||0),+(r[cr]||0),+(r[cc]||0),
              (r.__ind&&r.__ind[cn]!=null)?r.__ind[cn]:-1]);
  }
  function istot(nm){var u=nm.toUpperCase().replace(/\u00c9/g,'E').replace(/\s/g,'');
    return u.indexOf('TOTAL')===0;}
  function isgroup(i){           /* 들여쓰기: 다음 줄이 더 깊으면 자식이 있는 묶음 */
    var ind=DAT[i][4]; if(ind<0) return false;
    for(var j=i+1;j<DAT.length;j++){
      if(istot(DAT[j][0])) break;
      return DAT[j][4]>ind;
    }
    return false;
  }
  var out=[],gender=null,tq=0,tr=0,tc=0;
  for(var i=0;i<DAT.length;i++){
    var nm=DAT[i][0], up=nm.toUpperCase(), q=DAT[i][1], rr=DAT[i][2], co=DAT[i][3];
    if(GEN[up]){gender=GEN[up]; tq+=q; tr+=rr; tc+=co; continue;}
    if(istot(nm)) continue;
    if(isgroup(i)) continue;
    out.push({raw:nm,gender:gender,cat:gender,item:PROD[up]||null,
              qty:Math.round(q),rrp:Math.round(rr),cost:Math.round(co)});
  }
  return {file:fname,brand:null,rows:out,tot_qty:Math.round(tq),
          tot_rrp:Math.round(tr),tot_cost:Math.round(tc)};
}

});
