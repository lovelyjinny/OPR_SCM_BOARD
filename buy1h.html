<style>
:root{--ink:#1f2733;--ink2:#4a5568;--mut:#8a94a3;--line:#e4e8ee;--bg:#f5f7fa;--srf:#fff;
 --nv:#27395e;--gd:#b08d3f;--rd:#c0392b;--am:#c58f1b;--gn:#1e7a3c;--bl:#2b6cb0;
 --c여성:#c2557e;--c남성:#2b6cb0;--c아동:#c58f1b;--c잡화:#38857a}
*{box-sizing:border-box}
body{margin:0;padding:20px 24px 46px;background:var(--bg);color:var(--ink);
 font-family:'Malgun Gothic','맑은 고딕',sans-serif;font-size:15px;line-height:1.5}
.hero{background:linear-gradient(135deg,#27395e,#3b5183);color:#fff;border-radius:14px;padding:18px 24px;margin-bottom:16px}
.hero h1{margin:0;font-size:27px;letter-spacing:-.6px}
.hero p{margin:6px 0 0;font-size:14px;color:#c3cddd}
.panel{background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:700;color:var(--ink2)}
.fld select,.fld input{font-family:inherit;font-size:16px;font-weight:700;padding:9px 12px;
 border:1px solid #cfd6e0;border-radius:9px;background:#fff;color:var(--ink)}
.fld select{min-width:250px}
.fld input{width:104px;text-align:right}
.fld .u{font-size:12px;color:var(--mut);font-weight:400}
.tiles{display:flex;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.tile{flex:1;min-width:158px;background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.tile .t{font-size:13px;color:var(--mut);font-weight:700}
.tile .v{font-size:27px;font-weight:800;letter-spacing:-1px;margin-top:3px}
.tile .s{font-size:12px;color:var(--mut);margin-top:2px}
h2{font-size:18px;margin:0 0 4px}
.hint{font-size:13px;color:var(--mut);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--srf)}
th{background:#eef1f6;font-size:12.5px;color:var(--ink2);font-weight:700;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px;border-bottom:1px solid #f0f2f6;text-align:right;font-variant-numeric:tabular-nums}
td.l{text-align:left}
tr.sum td{background:#f7f9fc;font-weight:800;border-top:2px solid var(--nv)}
.cd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800}
.p-buy{background:#fdecea;color:var(--rd)} .p-ok{background:#e8f5ee;color:var(--gn)}
.p-over{background:#eaf1fb;color:var(--bl)}
.gsell{border-left:2px solid #b8c2cf}
.s2{font-size:12px;color:var(--mut);font-weight:400}
.plcbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:11.5px;
 font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.plcbtn:hover{background:#eef1f6}
.note{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.6}
#pop{display:none;position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:99;align-items:center;justify-content:center}
#pop>div{background:#fff;border-radius:12px;min-width:520px;max-width:760px;max-height:78vh;overflow:auto;padding:18px 22px}
.off{background:#fffaf0;border:1px solid #f0e0bd}
</style>

      +'<th>연간 판매<br>가능 수량</th><th>작년 판매</th>'
      +'<th class="gsell">현재 입고<br><span class="s2">수량</span></th><th>입고액<br><span class="s2">M</span></th>'
      +'<th>필요 매입<br><span class="s2">캐파÷소진율</span></th><th>과부족</th><th>판정</th>'
      +(off?'<th class="gsell">오퍼 수량</th><th>캐파 대비</th>':'')
      +'<th class="gsell">판매 피크</th><th>80% 도달</th><th>매입 마감<br><span class="s2">국내/해외</span></th></tr>';
  rows.forEach(function(r,i){
    var need = s>0 ? r.cap/s : 0;
    var gap  = need - r.inq;
    T.cap+=r.cap; T.inq+=r.inq; T.ina+=r.ina; T.need+=need; T.gap+=gap;
    var k=r.cat+'|'+r.item, ov=oq[k]||0; T.oq+=ov;
    var st = gap>need*0.1 ? '<span class="pill p-buy">매입</span>'
           : (gap < -need*0.1 ? '<span class="pill p-over">초과</span>' : '<span class="pill p-ok">적정</span>');
    var dl = (r.dl_dom||r.dl_imp) ? ((r.dl_dom||'-')+'주 / '+(r.dl_imp||'-')+'주') : '—';
    h+='<tr><td class="l"><span class="cd" style="background:'+CC[r.cat]+'"></span><b>'+r.item+'</b>'
      +' <span class="s2">'+r.cat+'</span>'
      +(r.curve&&r.curve.length?' <button class="plcbtn" onclick="plc('+i+')">PLC</button>':'')+'</td>'
      +'<td><b>'+n(r.cap)+'</b></td><td class="s2">'+n(r.ly)+'</td>'
      +'<td class="gsell">'+n(r.inq)+'</td><td>'+M(r.ina)+'</td>'
      +'<td>'+n(need)+'</td>'
      +'<td style="color:'+(gap>0?'var(--rd)':'var(--bl)')+';font-weight:800">'+(gap>0?'+':'')+n(gap)+'</td>'
      +'<td>'+st+'</td>'
      +(off?('<td class="gsell">'+(ov?n(ov):'<span class="s2">—</span>')+'</td><td>'
             +(ov&&r.cap?('<b>'+(ov/r.cap*100).toFixed(0)+'%</b>'):'<span class="s2">—</span>')+'</td>'):'')
      +'<td class="gsell">'+(r.peak||'—')+'</td><td>'+(r.p80||'—')+'</td><td class="s2">'+dl+'</td></tr>';
  });
  h+='<tr class="sum"><td class="l">합계</td><td>'+n(T.cap)+'</td><td></td>'
    +'<td class="gsell">'+n(T.inq)+'</td><td>'+M(T.ina)+'</td><td>'+n(T.need)+'</td>'
    +'<td style="color:'+(T.gap>0?'var(--rd)':'var(--bl)')+'">'+(T.gap>0?'+':'')+n(T.gap)+'</td><td></td>'
    +(off?('<td class="gsell">'+n(T.oq)+'</td><td>'+(T.cap?(T.oq/T.cap*100).toFixed(0)+'%':'—')+'</td>'):'')
    +'<td class="gsell"></td><td></td><td></td></tr>';
  document.getElementById('tbl').innerHTML=h;
  document.getElementById('ttl').innerHTML=bn+' <span class="s2">아이템 '+rows.length+'개</span>';

  /* TCR = [정판율 + (소진율−정판율)×(1−할인율)] ÷ 원가율  (회사 정의: 실매출÷입고액) */
  var tcr = ok ? (j + (s-j)*(1-d))/c : null;
  var addAmt = (T.gap>0 && T.inq>0) ? T.gap*(T.ina/T.inq) : 0;
  var tiles=[
   ['연간 판매 가능 수량', n(T.cap)+'<span class="s2"> 장</span>','작년 '+n(rows.reduce(function(a,r){return a+r.ly;},0))+'장 × 성장률','var(--ink)'],
   ['현재 입고', n(T.inq)+'<span class="s2"> 장</span>', M(T.ina)+'M','var(--ink)'],
   ['추가 매입 필요', (T.gap>0?'+':'')+n(T.gap)+'<span class="s2"> 장</span>',
      (addAmt?('약 '+M(addAmt)+'M'):'—'), T.gap>0?'var(--rd)':'var(--bl)'],
   ['예상 TCR', ok?(tcr.toFixed(2)+'<span class="s2"> 배</span>'):'—',
      ok?'실매출 ÷ 입고액':'⚠️ 정판율 ≤ 소진율 이어야 함','var(--gd)']
  ];
  if(off){
    var ocr = orrp? (ocost/orrp*100):0;
    tiles.push(['오퍼 물량', n(otq)+'<span class="s2"> 장</span>',
      (T.cap?('캐파 대비 '+(T.oq/T.cap*100).toFixed(0)+'%'):'—'),'var(--nv)']);
  }
  document.getElementById('tiles').innerHTML=tiles.map(function(t){
    return '<div class="tile'+(t[0]=='오퍼 물량'?' off':'')+'"><div class="t">'+t[0]+'</div>'
      +'<div class="v" style="color:'+t[3]+'">'+t[1]+'</div><div class="s">'+t[2]+'</div></div>';}).join('');

  var nt='판정 — 과부족이 필요 매입의 ±10%를 넘으면 <b>매입</b>/<b>초과</b>, 안이면 <b>적정</b>. ';
  nt+='예상 TCR = [정판율 + (소진율−정판율)×(1−할인율)] ÷ 원가율.';
  if(off){ nt+='<br>오퍼 <b>'+ofk+'</b> — 총 '+n(otq)+'장 · RRP '+n(orrp)+' · 오퍼가 '+n(ocost)
      +' (오퍼가/RRP '+(orrp?(ocost/orrp*100).toFixed(1):'-')+'%). 아이템으로 매칭된 물량만 위 표에 표시됩니다.'; }
  document.getElementById('note').innerHTML=nt;
}
function plc(i){
  var bn=document.getElementById('brand').value, r=(BD[bn]||[])[i]; if(!r) return;
  var c=r.curve||[], mx=Math.max.apply(null,c)||1, W=Math.min(c.length,WK.length);
  var bars='';
  for(var k=0;k<W;k++){
    var hh=Math.max(2,c[k]/mx*120);
    var pk=(WK[k]===r.peak);
    bars+='<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">'
      +'<div style="width:70%;height:'+hh+'px;background:'+(pk?'var(--gd)':'#cbd5e1')+';border-radius:3px 3px 0 0"></div>'
      +'<div style="font-size:8px;color:#98a1ac;margin-top:3px;writing-mode:vertical-rl">'+(k%2?'':WK[k])+'</div></div>';
  }
  document.getElementById('pop-t').textContent=r.cat+' '+r.item+' — 주차별 판매 곡선 (PLC)';
  document.getElementById('pop-b').innerHTML='<div style="display:flex;gap:2px;height:150px;align-items:flex-end">'+bars+'</div>'
    +'<div style="margin-top:12px;font-size:14px;line-height:1.9">'
    +'· 판매 피크 <b>'+(r.peak||'—')+'</b><br>'
    +'· 누적 80% 도달 <b>'+(r.p80||'—')+'</b><br>'
    +'· 리드타임 국내 <b>'+(r.dl_dom||'-')+'주</b> / 해외 <b>'+(r.dl_imp||'-')+'주</b>'
    +' → 피크에 맞추려면 그만큼 앞서 발주해야 합니다.</div>';
  document.getElementById('pop').style.display='flex';
}
['brand','offer','sell','jung','cost','disc'].forEach(function(id){
  document.getElementById(id).addEventListener('change',calc);
  document.getElementById(id).addEventListener('input',calc);
});
/* 오퍼를 고르면 그 브랜드로 자동 전환 */
document.getElementById('offer').addEventListener('change',function(){
  var o=OFF[this.value]; if(o&&o.brand){ var s=document.getElementById('brand');
    for(var i=0;i<s.options.length;i++) if(s.options[i].value===o.brand){ s.selectedIndex=i; break; } }
  calc();
});
calc();
</script>
